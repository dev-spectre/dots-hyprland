$mainMod = SUPER

# Window split ratio
#/# binde = $mainMod, ;/',, # Adjust split ratio
binde = $mainMod, Semicolon, splitratio, -0.1 # [hidden]
binde = $mainMod, Apostrophe, splitratio, +0.1 # [hidden]
# Positioning mode
bind = $mainMod+Alt, Space, togglefloating, # Float/Tile
bind = $mainMod+Shift, D, fullscreen, 1 # Maximize
bind = $mainMod+Shift, F, fullscreen, 0 # Fullscreen
bind = $mainMod+Alt, F, fullscreenstate, 0 3 # Fullscreen spoof
bind = $mainMod, P, pin # Pin

#/# bind = $mainMod+Alt, Hash,, # Send to workspace # (1, 2, 3,...)
# We use raw keycodes because some keyboard layouts register number keys as different chars. The codes can be verified with `wev`
bind = $mainMod+ALT, code:10, exec, ~/.config/hypr/hyprland/scripts/workspace_action.sh movetoworkspacesilent 1 # [hidden]
bind = $mainMod+ALT, code:11, exec, ~/.config/hypr/hyprland/scripts/workspace_action.sh movetoworkspacesilent 2 # [hidden]
bind = $mainMod+ALT, code:12, exec, ~/.config/hypr/hyprland/scripts/workspace_action.sh movetoworkspacesilent 3 # [hidden]
bind = $mainMod+ALT, code:13, exec, ~/.config/hypr/hyprland/scripts/workspace_action.sh movetoworkspacesilent 4 # [hidden]
bind = $mainMod+ALT, code:14, exec, ~/.config/hypr/hyprland/scripts/workspace_action.sh movetoworkspacesilent 5 # [hidden]
bind = $mainMod+ALT, code:15, exec, ~/.config/hypr/hyprland/scripts/workspace_action.sh movetoworkspacesilent 6 # [hidden]
bind = $mainMod+ALT, code:16, exec, ~/.config/hypr/hyprland/scripts/workspace_action.sh movetoworkspacesilent 7 # [hidden]
bind = $mainMod+ALT, code:17, exec, ~/.config/hypr/hyprland/scripts/workspace_action.sh movetoworkspacesilent 8 # [hidden]
bind = $mainMod+ALT, code:18, exec, ~/.config/hypr/hyprland/scripts/workspace_action.sh movetoworkspacesilent 9 # [hidden]
bind = $mainMod+ALT, code:19, exec, ~/.config/hypr/hyprland/scripts/workspace_action.sh movetoworkspacesilent 10 # [hidden]
# keypad numbers
bind = $mainMod+Alt, code:87, exec, ~/.config/hypr/hyprland/scripts/workspace_action.sh movetoworkspacesilent 1  # [hidden]
bind = $mainMod+Alt, code:88, exec, ~/.config/hypr/hyprland/scripts/workspace_action.sh movetoworkspacesilent 2  # [hidden]
bind = $mainMod+Alt, code:89, exec, ~/.config/hypr/hyprland/scripts/workspace_action.sh movetoworkspacesilent 3  # [hidden]
bind = $mainMod+Alt, code:83, exec, ~/.config/hypr/hyprland/scripts/workspace_action.sh movetoworkspacesilent 4  # [hidden]
bind = $mainMod+Alt, code:84, exec, ~/.config/hypr/hyprland/scripts/workspace_action.sh movetoworkspacesilent 5  # [hidden]
bind = $mainMod+Alt, code:85, exec, ~/.config/hypr/hyprland/scripts/workspace_action.sh movetoworkspacesilent 6  # [hidden]
bind = $mainMod+Alt, code:79, exec, ~/.config/hypr/hyprland/scripts/workspace_action.sh movetoworkspacesilent 7  # [hidden]
bind = $mainMod+Alt, code:80, exec, ~/.config/hypr/hyprland/scripts/workspace_action.sh movetoworkspacesilent 8  # [hidden]
bind = $mainMod+Alt, code:81, exec, ~/.config/hypr/hyprland/scripts/workspace_action.sh movetoworkspacesilent 9  # [hidden]
bind = $mainMod+Alt, code:90, exec, ~/.config/hypr/hyprland/scripts/workspace_action.sh movetoworkspacesilent 10 # [hidden]

# #/# bind = $mainMod+Shift, Scroll ↑/↓,, # Send to workspace left/right
bind = $mainMod+Shift, mouse_down, movetoworkspace, r-1 # [hidden]
bind = $mainMod+Shift, mouse_up, movetoworkspace, r+1 # [hidden]
bind = $mainMod+Alt, mouse_down, movetoworkspace, -1 # [hidden]
bind = $mainMod+Alt, mouse_up, movetoworkspace, +1 # [hidden]

#/# bind = $mainMod+Shift, Page_↑/↓,, # Send to workspace left/right
bind = $mainMod+Alt, Page_Down, movetoworkspace, +1 # [hidden]
bind = $mainMod+Alt, Page_Up, movetoworkspace, -1 # [hidden]
bind = $mainMod+Shift, Page_Down, movetoworkspace, r+1  # [hidden]
bind = $mainMod+Shift, Page_Up, movetoworkspace, r-1  # [hidden]
bind = Ctrl+$mainMod+Shift, Right, movetoworkspace, r+1 # [hidden]
bind = Ctrl+$mainMod+Shift, Left, movetoworkspace, r-1 # [hidden]

bind = $mainMod+Alt, S, movetoworkspacesilent, special # Send to scratchpad

bind = Ctrl+$mainMod, S, togglespecialworkspace, # [hidden]

